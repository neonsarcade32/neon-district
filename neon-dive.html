<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon Dive · the daily dive</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#061018;color:#e8f4ff;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}
.screen{width:100%;max-width:480px;height:100%;max-height:900px;position:relative;display:flex;flex-direction:column}

#title{background:linear-gradient(#7ec8f0 0%,#b8e0f8 28%,#4a90c4 42%,#1a3a6a 52%,#0a1a30 70%,#020810 100%);position:relative;overflow:hidden;flex:1}
.sky{position:absolute;inset:0 0 48% 0;background:linear-gradient(#9fd4f5,#d0ecff)}
.sun{position:absolute;right:18%;top:12%;width:60px;height:60px;border-radius:50%;background:#ffe680;box-shadow:0 0 40px #ffe680}
.cloud{position:absolute;background:#fff;border-radius:20px;opacity:.85}
.boat{position:absolute;left:50%;top:46%;transform:translateX(-50%);font-size:48px;filter:drop-shadow(0 4px 0 #0004)}
.logo{position:absolute;top:18%;left:0;right:0;text-align:center;z-index:2}
.logo h1{font-size:clamp(42px,12vw,64px);letter-spacing:4px;font-weight:900;color:#fff;text-shadow:3px 0 #ff6b9d,-3px 0 #5bdfff,0 3px #000}
.logo .sub{margin-top:8px;letter-spacing:6px;font-size:13px;color:#7ee0ff}
.logo .tag{margin-top:10px;font-size:11px;color:#c8e4ff;opacity:.9}
.begin{position:absolute;bottom:18%;left:50%;transform:translateX(-50%);width:min(320px,80%);background:#0a1628;border:2px solid #4adfff;color:#7ee0ff;padding:16px;font-weight:900;letter-spacing:2px;font-size:15px;cursor:pointer;border-radius:4px;z-index:3}
.begin:hover{background:#122038}
.diveNum{position:absolute;bottom:8%;left:20px;font-size:11px;color:#6a8aa8}
.krill{position:absolute;bottom:22%;right:18%;font-size:28px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}

#play{display:none;background:linear-gradient(#0a1a30,#020810);padding:20px;flex:1;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.prog{font-size:13px;color:#7ee0ff}
.timer{font-size:28px;font-weight:900;color:#ffd15c}
.timer.low{color:#ff6878;animation:pulse .4s infinite}
@keyframes pulse{50%{opacity:.6}}
.promptBox{background:#0c1828;border:1px solid #2a4a6a;border-radius:8px;padding:18px;margin:16px 0;min-height:90px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:16px;line-height:1.4}
.inputRow{display:flex;gap:8px;margin:12px 0}
input{flex:1;background:#061018;border:1px solid #3a5a7a;color:#fff;padding:14px;font-size:16px;border-radius:6px;outline:none}
input:focus{border-color:#4adfff}
button.dive{background:#1a3a5a;border:1px solid #4adfff;color:#7ee0ff;padding:14px 18px;font-weight:900;border-radius:6px;cursor:pointer}
.feedback{text-align:center;min-height:48px;margin:8px 0;font-size:14px}
.feedback .tier{font-weight:900;color:#59e49b}
.depthBar{height:8px;background:#0a1420;border:1px solid #2a4a6a;border-radius:999px;overflow:hidden;margin:12px 0}
.depthBar i{display:block;height:100%;background:linear-gradient(90deg,#4adfff,#59e49b);width:0;transition:.4s}
.score{text-align:center;font-size:22px;font-weight:900;color:#4adfff}
.landmarks{font-size:10px;color:#6a8aa8;text-align:center;margin-top:4px}

#result{display:none;background:#020810;padding:24px;text-align:center;flex:1;flex-direction:column;justify-content:center}
.resultTitle{font-size:28px;letter-spacing:3px;margin-bottom:8px}
.resultDepth{font-size:48px;font-weight:900;color:#4adfff;margin:12px 0}
.resultScore{font-size:18px;color:#7ee0ff;margin-bottom:20px}
.emoji{font-size:24px;letter-spacing:4px;margin:16px 0}
.share{background:#1a3a5a;border:1px solid #4adfff;color:#7ee0ff;padding:12px 20px;font-weight:900;border-radius:6px;cursor:pointer;margin:8px}
.again{background:transparent;border:1px solid #3a5a7a;color:#8aa;padding:12px 20px;border-radius:6px;cursor:pointer;margin:8px}
</style>
</head>
<body>
<div class="screen">
  <div id="title">
    <div class="sky"></div>
    <div class="sun"></div>
    <div class="cloud" style="width:80px;height:24px;top:18%;left:12%"></div>
    <div class="cloud" style="width:60px;height:18px;top:22%;right:20%"></div>
    <div class="logo">
      <h1>NEON DIVE</h1>
      <div class="sub">THE DAILY DIVE</div>
      <div class="tag">7 prompts · 25 seconds each · rarer answers sink deeper</div>
    </div>
    <div class="boat">🚢</div>
    <div class="krill">🦐</div>
    <button class="begin" id="beginBtn">▼ BEGIN DESCENT ▼</button>
    <div class="diveNum">DIVE #1</div>
  </div>

  <div id="play">
    <div class="top">
      <div class="prog" id="prog">1 / 7</div>
      <div class="timer" id="timer">25</div>
    </div>
    <div class="promptBox" id="prompt">Name a sport where athletes do flips</div>
    <div class="inputRow">
      <input id="answer" placeholder="type an answer..." autocomplete="off">
      <button class="dive" id="diveBtn">DIVE</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="depthBar"><i id="bar"></i></div>
    <div class="score" id="score">0 m</div>
    <div class="landmarks" id="landmarks">surface</div>
  </div>

  <div id="result">
    <div class="resultTitle">DESCENT COMPLETE</div>
    <div class="resultDepth" id="finalDepth">0 m</div>
    <div class="resultScore" id="finalScore">0 / 700</div>
    <div class="emoji" id="emoji">🟦🟦🟦🟦🟦🟦🟦</div>
    <button class="share" id="shareBtn">COPY RESULT</button>
    <button class="again" id="againBtn">PLAY AGAIN</button>
  </div>
</div>

<script>
const PROMPTS = [
  {q:"Name a sport where athletes do flips or somersaults", answers:{"gymnastics":10,"diving":30,"trampoline":60,"course landaise":100,"parkour":85,"synchronized swimming":30}},
  {q:"Name a city whose name starts with Los, Las, La, Le, El or The", answers:{"los angeles":10,"las vegas":15,"la ciotat":100,"the hague":60,"el paso":30,"la paz":30}},
  {q:"Name something used to grip or pick things up", answers:{"hands":10,"tongs":30,"claw of archimedes":100,"forceps":60,"tweezers":40,"pliers":30}},
  {q:"Name a non-human character from Star Wars, the MCU, or Lord of the Rings", answers:{"chewbacca":10,"groot":30,"jaxxon":100,"gollum":60,"rocket":40,"yoda":15,"sauron":30}},
  {q:"Name a nail care product or tool (types, not brands)", answers:{"nail polish":10,"file":30,"tea bag":100,"cuticle oil":60,"clippers":20,"buffer":30}},
  {q:"Name a way to contact someone (methods, not brands/apps)", answers:{"phone call":10,"text":15,"rocket mail":100,"letter":30,"smoke signal":60,"email":15,"telegram":40}},
  {q:"Name a fast food chain that operates in more than one country", answers:{"mcdonalds":10,"kfc":15,"coffee-bike":100,"burger king":20,"subway":30,"wendys":30,"dominoes":30}}
];
const TIERS = {10:"Plankton",15:"Too Clever",30:"Schooler",60:"Rare",85:"Deep Cut",100:"One in a Neon"};
const LANDMARKS = [[0,"surface"],[100,"twilight zone"],[332,"deepest scuba"],[1000,"midnight zone"],[3800,"Titanic"],[6000,"hadal trench"]];

let idx=0, score=0, timer=25, interval, answers=[];
const $ = id => document.getElementById(id);

function show(id){
  ['title','play','result'].forEach(s => $(s).style.display = s===id ? (s==='play'||s==='result'?'flex':'block') : 'none');
}
function start(){
  idx=0; score=0; answers=[];
  show('play');
  nextPrompt();
}
function nextPrompt(){
  if(idx >= PROMPTS.length) return end();
  const p = PROMPTS[idx];
  $('prog').textContent = (idx+1) + ' / 7';
  $('prompt').textContent = p.q;
  $('answer').value = '';
  $('answer').focus();
  $('feedback').textContent = '';
  timer = 25;
  $('timer').textContent = timer;
  $('timer').classList.remove('low');
  clearInterval(interval);
  interval = setInterval(()=>{
    timer--;
    $('timer').textContent = timer;
    if(timer <= 5) $('timer').classList.add('low');
    if(timer <= 0) submit(true);
  }, 1000);
}
function submit(timeout=false){
  clearInterval(interval);
  const raw = $('answer').value.trim().toLowerCase();
  const p = PROMPTS[idx];
  let pts = 0;
  if(!timeout && raw){
    for(const [k,v] of Object.entries(p.answers)){
      if(raw === k || raw.includes(k) || k.includes(raw)){ pts = v; break; }
    }
  }
  answers.push(pts);
  score += pts;
  const tier = pts ? TIERS[pts] : 'no echo';
  $('feedback').innerHTML = pts ? '<span class="tier">'+tier+'</span> · '+pts+' pts' : (timeout ? 'time' : 'no echo');
  updateDepth();
  idx++;
  setTimeout(nextPrompt, 900);
}
function updateDepth(){
  const m = score * 10;
  $('score').textContent = m + ' m';
  $('bar').style.width = Math.min(100, (score/700)*100) + '%';
  let land = 'surface';
  for(const [d,name] of LANDMARKS) if(m >= d) land = name;
  $('landmarks').textContent = land;
}
function end(){
  show('result');
  const m = score * 10;
  $('finalDepth').textContent = m.toLocaleString() + ' m';
  $('finalScore').textContent = score + ' / 700';
  const em = answers.map(p => p>=85?'🟩':p>=60?'🟨':p>=30?'🟧':p>0?'🟦':'⬛').join('');
  $('emoji').textContent = em;
}
$('beginBtn').onclick = start;
$('diveBtn').onclick = () => submit();
$('answer').onkeydown = e => { if(e.key==='Enter') submit(); };
$('againBtn').onclick = () => show('title');
$('shareBtn').onclick = () => {
  const text = 'Neon Dive\n'+score+'/700\n'+$('emoji').textContent+'\nneonsarcade32.github.io/neon-district/neon-dive.html';
  navigator.clipboard.writeText(text).then(() => $('shareBtn').textContent = 'COPIED');
};
</script>
</body>
</html>
