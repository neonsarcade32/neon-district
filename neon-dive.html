<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon Dive · the daily dive</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050a14;color:#e8f1ff;font-family:'VT323',ui-monospace,monospace;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}
.screen{width:100%;max-width:480px;height:100%;max-height:900px;position:relative;display:flex;flex-direction:column;overflow:hidden}

/* Title - pixel ocean */
#title{background:linear-gradient(#7ec8f0 0%,#b8e0f8 28%,#4a90c4 42%,#1a3a6a 52%,#0a1a30 70%,#020810 100%);position:relative;overflow:hidden;flex:1}
.sky{position:absolute;inset:0 0 48% 0;background:linear-gradient(#9fd4f5,#d0ecff)}
.sun{position:absolute;right:18%;top:12%;width:60px;height:60px;border-radius:50%;background:#ffe680;box-shadow:0 0 40px #ffe680}
.cloud{position:absolute;background:#fff;border-radius:20px;opacity:.85}
.boat{position:absolute;left:50%;top:46%;transform:translateX(-50%);font-size:48px;filter:drop-shadow(0 4px 0 #0004)}
.logo{position:absolute;top:16%;left:0;right:0;text-align:center;z-index:2}
.logo h1{font-size:clamp(56px,16vw,84px);letter-spacing:6px;font-weight:400;color:#fff;text-shadow:4px 0 #ff6b9d,-4px 0 #5bdfff,0 4px #000;line-height:1}
.logo .sub{margin-top:10px;letter-spacing:8px;font-size:18px;color:#7ee0ff}
.logo .tag{margin-top:12px;font-size:16px;color:#c8e4ff;opacity:.9}
.begin{position:absolute;bottom:16%;left:50%;transform:translateX(-50%);width:min(340px,84%);background:#101d33;border:2px solid #4adfff;color:#e8f1ff;padding:14px;font-weight:400;letter-spacing:3px;font-size:28px;cursor:pointer;border-radius:2px;z-index:3;font-family:'VT323',monospace}
.begin:hover{background:#1a2a48}
.diveNum{position:absolute;bottom:7%;left:18px;font-size:16px;color:#6a8aa8}
.krill{position:absolute;bottom:20%;right:16%;font-size:32px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}

/* Dive scene */
#play{display:none;flex:1;position:relative;overflow:hidden;background:#0a3050}
.ocean{position:absolute;inset:0;transition:background 1.2s}
.bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bubble{position:absolute;width:6px;height:6px;background:#fff4;border-radius:50%;animation:rise linear infinite}
@keyframes rise{from{transform:translateY(100vh)}to{transform:translateY(-20px)}}
.sub{position:absolute;left:50%;bottom:38%;transform:translateX(-50%);font-size:48px;transition:bottom 1.4s ease-out;filter:drop-shadow(0 4px 8px #0008);z-index:2}
.depthScale{position:absolute;right:8px;top:70px;bottom:120px;width:32px;border-left:1px solid #4adfff44;font-size:12px;color:#7ee0ffaa;z-index:3}
.depthMark{position:absolute;right:4px;white-space:nowrap}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:4}
.prog{background:#0a1628cc;border:1px solid #4adfff44;padding:6px 12px;border-radius:4px;font-size:18px;color:#7ee0ff}
.timer{background:#0a1628cc;border:1px solid #ffd15c44;padding:4px 12px;border-radius:4px;font-size:28px;color:#ffd15c;min-width:64px;text-align:center}
.timer.low{color:#ff6878;border-color:#ff687844;animation:pulse .4s infinite}
@keyframes pulse{50%{opacity:.55}}
.promptBox{position:absolute;top:56px;left:10px;right:10px;background:#0c1828ee;border:1px solid #4adfff55;border-radius:6px;padding:16px;text-align:center;font-size:22px;line-height:1.3;z-index:4;min-height:72px;display:flex;align-items:center;justify-content:center}
.inputArea{position:absolute;bottom:14px;left:10px;right:10px;z-index:4}
.inputRow{display:flex;gap:8px}
input{flex:1;background:#061018ee;border:1px solid #4adfff66;color:#e8f1ff;padding:12px 14px;font-size:22px;border-radius:4px;outline:none;font-family:'VT323',monospace}
input:focus{border-color:#4adfff}
button.dive{background:#1a3a5a;border:1px solid #4adfff;color:#7ee0ff;padding:12px 16px;font-size:22px;border-radius:4px;cursor:pointer;font-family:'VT323',monospace}
.feedback{text-align:center;margin-top:6px;font-size:18px;min-height:22px}
.feedback .tier{color:#59e49b}
.scoreHud{position:absolute;left:10px;bottom:88px;background:#0a1628cc;border:1px solid #4adfff33;padding:6px 12px;border-radius:4px;font-size:18px;color:#4adfff;z-index:4}
.landHud{position:absolute;left:10px;bottom:120px;font-size:14px;color:#7ee0ffaa;z-index:4}

/* Result */
#result{display:none;background:#020810;padding:24px;text-align:center;flex:1;flex-direction:column;justify-content:center}
.resultTitle{font-size:36px;letter-spacing:4px;margin-bottom:8px}
.resultDepth{font-size:56px;color:#4adfff;margin:10px 0}
.resultScore{font-size:22px;color:#7ee0ff;margin-bottom:16px}
.emoji{font-size:24px;letter-spacing:4px;margin:14px 0}
.share{background:#1a3a5a;border:1px solid #4adfff;color:#7ee0ff;padding:12px 20px;font-size:22px;border-radius:4px;cursor:pointer;margin:6px;font-family:'VT323',monospace}
.again{background:transparent;border:1px solid #3a5a7a;color:#8aa;padding:12px 20px;font-size:22px;border-radius:4px;cursor:pointer;margin:6px;font-family:'VT323',monospace}
</style>
</head>
<body>
<div class="screen">
  <div id="title">
    <div class="sky"></div>
    <div class="sun"></div>
    <div class="cloud" style="width:80px;height:24px;top:18%;left:12%"></div>
    <div class="cloud" style="width:60px;height:18px;top:22%;right:20%"></div>
    <div class="logo">
      <h1>NEON DIVE</h1>
      <div class="sub">THE ENDLESS DIVE</div>
      <div class="tag">dive after dive · rarer answers sink deeper</div>
    </div>
    <div class="boat">🚢</div>
    <div class="krill">🦐</div>
    <button class="begin" id="beginBtn">▼ BEGIN DESCENT ▼</button>
    <div class="diveNum">ENDLESS</div>
  </div>

  <div id="play">
    <div class="ocean" id="ocean"></div>
    <div class="bubbles" id="bubbles"></div>
    <div class="sub" id="sub">🚤</div>
    <div class="depthScale" id="scale"></div>
    <div class="hud">
      <div class="prog" id="prog">1 / ∞</div>
      <div class="timer" id="timer">25</div>
    </div>
    <div class="promptBox" id="prompt">Name a sport where athletes do flips</div>
    <div class="landHud" id="landmarks">surface</div>
    <div class="scoreHud" id="score">0 m</div>
    <div class="inputArea">
      <div class="inputRow">
        <input id="answer" placeholder="type an answer..." autocomplete="off">
        <button class="dive" id="diveBtn">DIVE</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  </div>

  <div id="result">
    <div class="resultTitle">SURFACED</div>
    <div class="resultDepth" id="finalDepth">0 m</div>
    <div class="resultScore" id="finalScore">0 points</div>
    <div class="emoji" id="emoji"></div>
    <button class="share" id="shareBtn">COPY RESULT</button>
    <button class="again" id="againBtn">DIVE AGAIN</button>
  </div>
</div>

<script>
const BANK = [
  {q:"Name a sport where athletes do flips or somersaults", answers:{"gymnastics":10,"diving":30,"trampoline":60,"course landaise":100,"parkour":85,"synchronized swimming":30}},
  {q:"Name a city whose name starts with Los, Las, La, Le, El or The", answers:{"los angeles":10,"las vegas":15,"la ciotat":100,"the hague":60,"el paso":30,"la paz":30}},
  {q:"Name something used to grip or pick things up", answers:{"hands":10,"tongs":30,"claw of archimedes":100,"forceps":60,"tweezers":40,"pliers":30}},
  {q:"Name a non-human character from Star Wars, the MCU, or Lord of the Rings", answers:{"chewbacca":10,"groot":30,"jaxxon":100,"gollum":60,"rocket":40,"yoda":15,"sauron":30}},
  {q:"Name a nail care product or tool (types, not brands)", answers:{"nail polish":10,"file":30,"tea bag":100,"cuticle oil":60,"clippers":20,"buffer":30}},
  {q:"Name a way to contact someone (methods, not brands/apps)", answers:{"phone call":10,"text":15,"rocket mail":100,"letter":30,"smoke signal":60,"email":15,"telegram":40}},
  {q:"Name a fast food chain that operates in more than one country", answers:{"mcdonalds":10,"kfc":15,"coffee-bike":100,"burger king":20,"subway":30,"wendys":30,"dominoes":30}},
  {q:"Name a type of cheese", answers:{"cheddar":10,"mozzarella":15,"brie":30,"gorgonzola":60,"cabrales":100,"halloumi":60,"parmesan":15}},
  {q:"Name a chemical element", answers:{"oxygen":10,"gold":15,"helium":30,"tungsten":60,"einsteinium":100,"carbon":15,"iron":15}},
  {q:"Name a country in Europe", answers:{"france":10,"germany":15,"spain":15,"estonia":60,"andorra":100,"malta":60,"switzerland":30}},
  {q:"Name a musical instrument", answers:{"guitar":10,"piano":15,"drums":15,"oboe":60,"didgeridoo":100,"violin":30,"harp":60}},
  {q:"Name a fruit that is not an apple or banana", answers:{"orange":10,"grape":15,"mango":30,"durian":60,"rambutan":100,"kiwi":30,"papaya":60}},
  {q:"Name a job that starts with the letter S", answers:{"singer":10,"scientist":15,"surgeon":30,"sommelier":60,"stevedore":100,"sailor":30,"sculptor":60}},
  {q:"Name an animal that lives in the ocean", answers:{"shark":10,"dolphin":15,"whale":30,"anglerfish":60,"vampire squid":100,"jellyfish":30,"octopus":30}},
  {q:"Name a programming language", answers:{"python":10,"javascript":15,"java":15,"rust":30,"haskell":60,"fortran":100,"lisp":60}},
  {q:"Name a planet in our solar system", answers:{"earth":10,"mars":15,"jupiter":15,"neptune":30,"mercury":30,"pluto":60,"ceres":100}},
  {q:"Name a board game", answers:{"chess":10,"monopoly":15,"scrabble":15,"catan":30,"ticket to ride":60,"go":100,"risk":30}},
  {q:"Name a type of tree", answers:{"oak":10,"pine":15,"maple":15,"baobab":60,"sequoia":60,"bristlecone":100,"willow":30}},
  {q:"Name a color that is not red, blue, or green", answers:{"yellow":10,"orange":15,"purple":15,"turquoise":30,"magenta":60,"chartreuse":100,"indigo":60}},
  {q:"Name a mountain or mountain range", answers:{"everest":10,"alps":15,"rockies":15,"andes":30,"kilimanjaro":60,"denali":60,"k2":100}}
];
const TIERS = {10:"Plankton",15:"Too Clever",30:"Schooler",60:"Rare",85:"Deep Cut",100:"One in a Neon"};
const LANDMARKS = [[0,"surface"],[100,"twilight"],[332,"deepest scuba"],[1000,"midnight"],[3800,"Titanic"],[6000,"hadal"],[11000,"challenger deep"]];

let pool=[], idx=0, score=0, timer=25, interval, answers=[], round=1;
const $ = id => document.getElementById(id);

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function show(id){
  ['title','play','result'].forEach(s => $(s).style.display = s===id ? (s==='play'||s==='result'?'flex':'block') : 'none');
}
function makeBubbles(){
  const b = $('bubbles');
  b.innerHTML = '';
  for(let i=0;i<18;i++){
    const el = document.createElement('div');
    el.className = 'bubble';
    el.style.left = Math.random()*100 + '%';
    el.style.animationDuration = (6+Math.random()*8) + 's';
    el.style.animationDelay = (Math.random()*6) + 's';
    el.style.width = el.style.height = (4+Math.random()*8) + 'px';
    b.appendChild(el);
  }
}
function start(){
  pool = shuffle([...BANK]);
  idx=0; score=0; answers=[]; round=1;
  show('play');
  makeBubbles();
  nextPrompt();
}
function nextPrompt(){
  if(idx >= pool.length){ pool = shuffle([...BANK]); idx=0; }
  const p = pool[idx];
  $('prog').textContent = round + ' / ∞';
  $('prompt').textContent = p.q;
  $('answer').value = '';
  $('answer').focus();
  $('feedback').textContent = '';
  timer = 25;
  $('timer').textContent = timer;
  $('timer').classList.remove('low');
  clearInterval(interval);
  interval = setInterval(()=>{
    timer--;
    $('timer').textContent = timer;
    if(timer <= 5) $('timer').classList.add('low');
    if(timer <= 0) submit(true);
  }, 1000);
}
function submit(timeout=false){
  clearInterval(interval);
  const raw = $('answer').value.trim().toLowerCase();
  const p = pool[idx];
  let pts = 0;
  if(!timeout && raw){
    for(const [k,v] of Object.entries(p.answers)){
      if(raw === k || raw.includes(k) || k.includes(raw)){ pts = v; break; }
    }
  }
  answers.push(pts);
  score += pts;
  const tier = pts ? TIERS[pts] : 'no echo';
  $('feedback').innerHTML = pts ? '<span class="tier">'+tier+'</span> · '+pts+' pts' : (timeout ? 'time' : 'no echo');
  updateDive();
  idx++; round++;
  setTimeout(nextPrompt, 1100);
}
function updateDive(){
  const m = score * 10;
  $('score').textContent = m.toLocaleString() + ' m';
  const subBottom = Math.max(18, 38 - Math.min(20, m/400));
  $('sub').style.bottom = subBottom + '%';
  const t = Math.min(1, m/8000);
  const r = Math.round(10 - t*8);
  const g = Math.round(48 - t*40);
  const b = Math.round(80 - t*60);
  $('ocean').style.background = `rgb(${r},${g},${b})`;
  let land = 'surface';
  for(const [d,name] of LANDMARKS) if(m >= d) land = name;
  $('landmarks').textContent = land;
  const sc = $('scale');
  sc.innerHTML = '';
  LANDMARKS.forEach(([d,name])=>{
    const pct = Math.min(95, (d/11000)*100);
    const el = document.createElement('div');
    el.className = 'depthMark';
    el.style.bottom = pct + '%';
    el.textContent = d;
    sc.appendChild(el);
  });
}
function end(){
  show('result');
  const m = score * 10;
  $('finalDepth').textContent = m.toLocaleString() + ' m';
  $('finalScore').textContent = score + ' points · ' + (round-1) + ' prompts';
  const em = answers.slice(-12).map(p => p>=85?'🟩':p>=60?'🟨':p>=30?'🟧':p>0?'🟦':'⬛').join('');
  $('emoji').textContent = em || '⬛';
}
$('beginBtn').onclick = start;
$('diveBtn').onclick = () => submit();
$('answer').onkeydown = e => { if(e.key==='Enter') submit(); };
$('againBtn').onclick = () => show('title');
$('shareBtn').onclick = () => {
  const text = 'Neon Dive Endless\n'+score+' pts · '+(score*10)+'m\n'+$('emoji').textContent+'\nneonsarcade32.github.io/neon-district/neon-dive.html';
  navigator.clipboard.writeText(text).then(() => $('shareBtn').textContent = 'COPIED');
};
document.addEventListener('keydown', e => { if(e.key==='Escape' && $('play').style.display==='flex') end(); });
</script>
</body>
</html>
