services:
  - type: web
    name: charliesturm0106-arcade-mp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit

  - type: web
    name: neon-district-authorized-browser
    runtime: docker
    dockerfilePath: ./authorized-browser/Dockerfile
    dockerContext: ./authorized-browser
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BROWSER_API_TOKEN
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://neonsarcade32.github.io
      - key: ALLOWED_HOSTS
        sync: false
      - key: MAX_SESSIONS
        value: "2"
      - key: SESSION_TTL_MS
        value: "600000"
