name: Neon Proxy end-to-end

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'neon-proxy.html'
      - 'tests/neon-proxy-e2e.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/neon-proxy-e2e.yml'

permissions:
  contents: read

jobs:
  mobile-emulated-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test deployed Neon Proxy in mobile emulation
        env:
          NEON_PROXY_URL: https://neonsarcade32.github.io/neon-district/neon-proxy.html
        run: npm run test:neon-proxy
