name: Neon District 3.0 game QA

on:
  push:
    branches: [main, neon-district-3.0-upgrade, neon-district-3-visual-rebuild]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  all-games:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Static checks — every game, source file and asset
        run: npm run test:arcade
      - name: 3D Bowling scoring rules
        run: npm run test:bowling
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start arcade test server
        run: |
          node server.js > /tmp/neon-district-server.log 2>&1 &
          echo $! > /tmp/neon-district-server.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/neon-district-server.log
          exit 1
      - name: Multiplayer regression tests
        run: npm run test:multiplayer
      - name: Browser smoke test — 35 games, desktop and mobile
        run: npm run test:browser
      - name: Real gameplay checks — upgraded modes and flagship UI
        run: npm run test:gameplay
      - name: Visual regression — all 35 games at desktop and mobile widths
        run: npm run test:visual
      - name: Upload visual gallery screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-district-3-visual-gallery
          path: test-artifacts/nd3-visual
          if-no-files-found: ignore
          retention-days: 10
      - name: Visual rebuild and mobile regression checks
        run: npm run test:visual3
      - name: Upload visual comparison screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neon-district-3-visual-snapshots
          path: tests/screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - name: Server output when checks fail
        if: failure()
        run: cat /tmp/neon-district-server.log || true
