name: Build Cork7 standalone hosted client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_cork7_standalone.py
      - .github/workflows/cork7-standalone-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Build original Cork7 client as a self-hosted React entry
        run: python3 scripts/build_cork7_standalone.py
      - name: Confirm standalone dependency paths
        run: |
          grep -q 'nd-standalone-vite-preload.js' cork7-assets/_next/static/chunks/game-client-ND-standalone.js
          test -f cork7-assets/models/rider-v20.glb
      - name: Commit standalone first-party files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cork7-assets/_next/static/chunks/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build first-party Cork7 React game without Vinext hydration"
          git pull --rebase origin main
          git push origin HEAD:main
