name: Build Cork7 standalone hosted client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_cork7_standalone.py
      - .github/workflows/cork7-standalone-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Build original Cork7 client as a self-hosted React entry
        run: python3 scripts/build_cork7_standalone.py
      - name: Confirm standalone dependency paths
        run: |
          grep -q 'nd-standalone-vite-preload.js' cork7-assets/_next/static/chunks/game-client-ND-standalone.js
          test -f cork7-assets/models/rider-v20.glb
      - name: Commit standalone first-party files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cork7-assets/_next/static/chunks/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build first-party Cork7 React game without Vinext hydration"
          # Other Cork7 asset-sync jobs may write main at the same time.
          # Refetch and rebase before each push so an ordinary race does not
          # leave the built game bundle out of sync with its build script.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update detected; retrying ($attempt/4)"
            sleep 2
          done
          echo "Failed to publish rebuilt game bundle after retries"
          exit 1
