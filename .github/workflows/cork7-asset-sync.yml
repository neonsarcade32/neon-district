name: Cork7 first-party game asset sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cork7-asset-sync.yml
      - scripts/sync_cork7_assets.py

permissions:
  contents: write

concurrency:
  group: cork7-first-party-assets
  cancel-in-progress: false

jobs:
  mirror-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and mirror authorized Cork7 3D assets
        run: python3 scripts/sync_cork7_assets.py
      - name: Verify rider model and route repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cork7-assets/models/rider-v20.glb')
          assert p.exists() and p.open('rb').read(4) == b'glTF'
          engine = Path('cork7-assets/_next/static/chunks/engine-mtSWjbmj.js').read_text()
          assert '/neon-district/cork7-assets/models/rider-v20.glb' in engine
          assert 'new ho().load(`/models/rider-v20.glb`' not in engine
          print('PASS: local GLB and first-party engine path')
          PY
      - name: Commit synced assets and repaired game files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cork7.html cork7-assets/
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Host authorized Cork7 skier and mountain assets inside Neon District"
          git pull --rebase origin main
          git push origin HEAD:main
