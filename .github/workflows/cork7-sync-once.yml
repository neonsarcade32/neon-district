name: One-time Cork7 November 2026 snapshot refresh

on:
  push:
    branches:
      - fix/cork7-sync-20261116-actions

permissions:
  contents: write

jobs:
  cork7-sync:
    if: github.event.head_commit.message == 'Run one-time Cork7 sync'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and adapt permitted current Cork7 public game assets
        run: python3 scripts/cork7_sync_once.py
      - name: Verify game catalog and current client dependency routing
        run: |
          npm install --no-audit --no-fund
          npm run test:arcade
          node tests/cork7-preload-urls.cjs
      - name: Commit verified snapshot on update branch
        run: |
          git config user.name "neon-district-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md cork7.html cork7-standalone.js cork7-offline-sw.js tests/arcade-integrity.cjs tests/cork7-preload-urls.cjs cork7-assets/
          git diff --cached --quiet && { echo "No new snapshot"; exit 1; }
          git commit -m "Refresh Cork7 to current November 2026 build [skip ci]"
          git push origin HEAD:fix/cork7-sync-20261116-actions
