name: Mirror Cork7 3D assets to Neon District

on:
  push:
    branches: [main]
    paths:
      - scripts/mirror-cork7-assets.py
      - .github/workflows/cork7-asset-mirror.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cork7-asset-mirror
  cancel-in-progress: false

jobs:
  mirror-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Neon District
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download first-party Cork7 rider and mountain models
        run: python3 scripts/mirror-cork7-assets.py

      - name: Verify the required model is a real glTF binary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          model = Path('cork7-assets/models/rider-v20.glb')
          assert model.is_file(), 'Cork7 rider file missing'
          assert model.read_bytes()[:4] == b'glTF', 'Cork7 rider asset is not a GLB model'
          print('PASS: rider asset exists and has GLB header; bytes:', model.stat().st_size)
          PY

      - name: Commit mirrored assets
        run: |
          git config user.name "neon-district-bot"
          git config user.email "neon-district-bot@users.noreply.github.com"
          git add cork7-assets/models cork7-assets/textures
          if git diff --cached --quiet; then
            echo "All models are already present."
          else
            git commit -m "Mirror authorized Cork7 models for local GitHub Pages gameplay"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
