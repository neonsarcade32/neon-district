<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cork7 · Neon District</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#102b35;color:white;font-family:system-ui}main{text-align:center;padding:24px}a{color:#99e2ff}</style></head><body><main id="fallback"><h1>Loading Cork7…</h1><p>Loading the original skiing game inside Neon District.</p></main><script>
(async()=>{
 try{
  const url='https://cork7.com/';
  const response=await fetch(url,{mode:'cors',credentials:'omit',cache:'no-cache'});
  if(!response.ok)throw new Error('Cork7 responded with HTTP '+response.status);
  let html=await response.text();
  if(!html.includes('<head>')||!html.includes('</html>'))throw new Error('Unexpected game response');
  const bridgeUrl=new URL('cork7-bridge.js',location.href).href;
  const bootstrap='<base href="https://cork7.com/"><scr'+'ipt src="'+bridgeUrl+'"></scr'+'ipt>';
  html=html.replace('<head>','<head>'+bootstrap);
  document.open();document.write(html);document.close();
 }catch(err){
  console.error('Neon District Cork7 loader:',err);
  document.getElementById('fallback').innerHTML='<h1>Cork7 could not load</h1><p>The game is temporarily unavailable through this page.</p><p><a href="https://cork7.com/" rel="noopener noreferrer" target="_blank">Open Cork7 directly ↗</a></p>';
 }
})();
</script></body></html>
